
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AR Solar System Explorer 3D</title>

    <link rel="stylesheet" href="style.css">

     <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR Image Tracking Library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

    <!-- HEADER -->

    <header id="header">
        <h1>🌌 AR SOLAR SYSTEM EXPLORER</h1>
        <p>Explore the universe through Augmented Reality</p>
        <div id="status">📷 Waiting for Solar System marker...</div>
    </header>


    <!-- MAIN INFORMATION PANEL -->

    <section id="infoPanel">

        <h2 id="planetName">Welcome Explorer!</h2>

        <p id="planetDescription">
            Scan your Solar System marker and select a planet
            to explore its features.
        </p>

        <div id="planetFacts"></div>

    </section>


    <!-- AR CONTROLS -->

    <section id="controls">

        <div class="control-heading">PLANET EXPLORER</div>

        <div id="planetButtons">

            <button onclick="showPlanet('Sun')">☀ Sun</button>
            <button onclick="showPlanet('Mercury')">Mercury</button>
            <button onclick="showPlanet('Venus')">Venus</button>
            <button onclick="showPlanet('Earth')">Earth</button>
            <button onclick="showPlanet('Mars')">Mars</button>
            <button onclick="showPlanet('Jupiter')">Jupiter</button>
            <button onclick="showPlanet('Saturn')">Saturn</button>
            <button onclick="showPlanet('Uranus')">Uranus</button>
            <button onclick="showPlanet('Neptune')">Neptune</button>

        </div>

        <div class="control-heading">SYSTEM CONTROLS</div>

        <div id="systemButtons">

            <button onclick="zoomIn()">＋ Zoom In</button>

            <button onclick="zoomOut()">－ Zoom Out</button>

            <button onclick="toggleAnimation()" id="pauseButton">
                ⏸ Pause
            </button>

            <button onclick="resetSystem()" class="reset">
                ↻ Reset
            </button>

            <button onclick="openQuiz()" class="quizButton">
                🧠 Start Quiz
            </button>

        </div>

    </section>


    <!-- QUIZ WINDOW -->

    <div id="quizOverlay">

        <div id="quizBox">

            <h2>🌟 Solar System Quiz</h2>

            <p id="questionNumber">Question 1 of 5</p>

            <h3 id="questionText"></h3>

            <div id="answerOptions"></div>

            <p id="quizFeedback"></p>

            <button id="nextButton" onclick="nextQuestion()">
                Next Question
            </button>

            <div id="quizResult"></div>

            <button onclick="closeQuiz()" id="closeQuizButton">
                Close Quiz
            </button>

        </div>

    </div>


    <!-- AR SCENE -->

    <a-scene

        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"

        color-space="sRGB"

        renderer="colorManagement: true; antialias: true"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        loading-screen="enabled: false">


        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- IMAGE TARGET -->

        <a-entity id="arTarget"
                  mindar-image-target="targetIndex: 0">


            <!-- COMPLETE SOLAR SYSTEM GROUP -->

            <a-entity id="solarSystem">


                <!-- SUN -->

                <a-sphere
                    id="sun"
                    position="0 0 0.07"
                    radius="0.065"
                    material="
                        color: #FFB300;
                        emissive: #FF8C00;
                        emissiveIntensity: 0.8;
                        roughness: 0.8">
                </a-sphere>

                <!-- SUN GLOW -->

                <a-sphere
                    position="0 0 0.07"
                    radius="0.082"
                    material="
                        color: #FFAA00;
                        transparent: true;
                        opacity: 0.15;
                        side: double">
                </a-sphere>


                <!-- MERCURY -->

                <a-torus
                    position="0 0 0.02"
                    radius="0.12"
                    radius-tubular="0.0015"
                    material="color: #999999">
                </a-torus>

                <a-entity id="mercuryOrbit">

                    <a-sphere
                        id="mercury"
                        position="0.12 0 0.075"
                        radius="0.017"
                        material="color: #A9A9A9; roughness: 1">
                    </a-sphere>

                </a-entity>


                <!-- VENUS -->

                <a-torus
                    position="0 0 0.02"
                    radius="0.17"
                    radius-tubular="0.0015"
                    material="color: #E5B66B">
                </a-torus>

                <a-entity id="venusOrbit">

                    <a-sphere
                        id="venus"
                        position="0.17 0 0.075"
                        radius="0.023"
                        material="color: #E6B566; roughness: 0.9">
                    </a-sphere>

                </a-entity>


                <!-- EARTH -->

                <a-torus
                    position="0 0 0.02"
                    radius="0.22"
                    radius-tubular="0.0015"
                    material="color: #168AFF">
                </a-torus>

                <a-entity id="earthOrbit">

                    <a-sphere
                        id="earth"
                        position="0.22 0 0.075"
                        radius="0.028"
                        material="
                            color: #1677FF;
                            roughness: 0.7">
                    </a-sphere>

                    <!-- EARTH LAND DETAILS -->

                    <a-sphere
                        position="0.215 0.008 0.099"
                        radius="0.009"
                        scale="1 0.6 0.5"
                        material="color: #35B66A">
                    </a-sphere>

                    <a-sphere
                        position="0.228 -0.012 0.098"
                        radius="0.008"
                        scale="0.8 1 0.5"
                        material="color: #35B66A">
                    </a-sphere>

                </a-entity>


                <!-- MARS -->

                <a-torus
                    position="0 0 0.02"
                    radius="0.27"
                    radius-tubular="0.0015"
                    material="color: #E65B38">
                </a-torus>

                <a-entity id="marsOrbit">

                    <a-sphere
                        id="mars"
                        position="0.27 0 0.075"
                        radius="0.022"
                        material="color: #D84B30; roughness: 1">
                    </a-sphere>

                </a-entity>


                <!-- JUPITER -->

                <a-torus
                    position="0 0 0.02"
                    radius="0.32"
                    radius-tubular="0.0015"
                    material="color: #D5A77A">
                </a-torus>

                <a-entity id="jupiterOrbit">

                    <a-sphere
                        id="jupiter"
                        position="0.32 0 0.075"
                        radius="0.045"
                        material="color: #D6A078; roughness: 0.95">
                    </a-sphere>

                    <!-- JUPITER CLOUD BAND -->

                    <a-torus
                        position="0.32 0 0.075"
                        radius="0.045"
                        radius-tubular="0.003"
                        scale="1 1 0.35"
                        material="color: #F3D5A0">
                    </a-torus>

                </a-entity>


                <!-- SATURN -->

                <a-torus
                    position="0 0 0.02"
                    radius="0.37"
                    radius-tubular="0.0015"
                    material="color: #E5C78A">
                </a-torus>

                <a-entity id="saturnOrbit">

                    <a-sphere
                        id="saturn"
                        position="0.37 0 0.075"
                        radius="0.037"
                        material="color: #E5C78A">
                    </a-sphere>

                    <!-- SATURN RINGS -->

                    <a-torus
                        position="0.37 0 0.075"
                        radius="0.052"
                        radius-tubular="0.006"
                        rotation="15 0 0"
                        scale="1.5 0.7 0.5"
                        material="color: #D7B77C">
                    </a-torus>

                </a-entity>


                <!-- URANUS -->

                <a-torus
                    position="0 0 0.02"
                    radius="0.42"
                    radius-tubular="0.0015"
                    material="color: #70D9E7">
                </a-torus>

                <a-entity id="uranusOrbit">

                    <a-sphere
                        id="uranus"
                        position="0.42 0 0.075"
                        radius="0.027"
                        material="color: #70D9E7">
                    </a-sphere>

                </a-entity>


                <!-- NEPTUNE -->

                <a-torus
                    position="0 0 0.02"
                    radius="0.465"
                    radius-tubular="0.0015"
                    material="color: #4169E1">
                </a-torus>

                <a-entity id="neptuneOrbit">

                    <a-sphere
                        id="neptune"
                        position="0.465 0 0.075"
                        radius="0.027"
                        material="color: #4169E1">
                    </a-sphere>

                </a-entity>

            </a-entity>

        </a-entity>

    </a-scene>


    <script src="script.js"></script>

</body>
</html>
